<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de Despliegue FTP</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #1e293b;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 500px;
      border: 1px solid #334155;
    }
    h1 {
      color: #38bdf8;
      margin-top: 0;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      background: #0369a1;
      color: #e0f2fe;
      padding: 0.35rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Despliegue FTP Exitoso</h1>
    <p>Este archivo de prueba fue subido automáticamente mediante <strong>GitHub Actions</strong>.</p>
    <div class="badge">testjule - Pipeline Activo</div>
  </div>
</body>
</html>
